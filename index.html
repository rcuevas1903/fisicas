<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Física básica en A-Frame</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- 1) A-Frame (el motor 3D/VR). Se usa la 1.7.1 porque es la que mejor
          se lleva con la librería de física. -->
  <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>

  <!-- 2) Motor de física (basado en Cannon.js). Agrega los componentes:
          static-body  → objeto fijo que no se mueve (piso, rampa, paredes)
          dynamic-body → objeto que tiene masa, cae y choca -->
  <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-physics-system@v4.2.2/dist/aframe-physics-system.min.js"></script>

  <script>
    /*
      COMPONENTE "lanzador"
      Lanza una pelota en la dirección en que apunta la entidad.
      - En la compu: tecla ESPACIO (se pone en la cámara).
      - En el Quest: gatillo del control (se pone en el control).

      >>> PARA AJUSTAR LA VELOCIDAD DE LANZAMIENTO <<<
      Cambia el valor "velocidad" en los atributos lanzador="..." de las
      3 entidades al final del archivo (cámara, control derecho y control
      izquierdo). Actualmente es 20 m/s. (El "default: 8" de abajo solo se
      usa si una entidad no especifica velocidad.)
    */
    AFRAME.registerComponent('lanzador', {
      schema: {
        velocidad: { type: 'number', default: 8 },   // m/s
        masa:      { type: 'number', default: 1 },   // kg
        maxPelotas:{ type: 'int',    default: 25 }   // para no saturar el visor
      },

      init: function () {
        this.pelotas = [];
        this.lanzar = this.lanzar.bind(this);

        // Teclado (solo tiene sentido en la cámara)
        if (this.el.hasAttribute('camera')) {
          window.addEventListener('keydown', (e) => {
            if (e.code === 'Space') this.lanzar();
            if (e.code === 'KeyR') location.reload();   // R = reiniciar escena
          });
        }
        // Gatillo de los controles del Quest
        this.el.addEventListener('triggerdown', this.lanzar);
      },

      lanzar: function () {
        const obj = this.el.object3D;

        // Posición y dirección del lanzador en el mundo
        const origen = new THREE.Vector3();
        const dir = new THREE.Vector3();
        obj.getWorldPosition(origen);
        obj.getWorldDirection(dir);
        dir.negate();                 // en A-Frame "al frente" es -Z

        const inicio = origen.clone().add(dir.clone().multiplyScalar(0.5));

        // Crear la pelota
        const pelota = document.createElement('a-sphere');
        pelota.setAttribute('radius', 0.15);
        pelota.setAttribute('color', '#' + Math.floor(Math.random() * 0xffffff).toString(16).padStart(6, '0'));
        pelota.setAttribute('position', inicio);
        pelota.setAttribute('dynamic-body', `mass: ${this.data.masa}; shape: sphere; sphereRadius: 0.15`);

        // Cuando el cuerpo físico ya existe, le damos velocidad inicial (v = dir * rapidez)
        pelota.addEventListener('body-loaded', () => {
          const v = this.data.velocidad;
          pelota.body.velocity.set(dir.x * v, dir.y * v, dir.z * v);
        });

        this.el.sceneEl.appendChild(pelota);

        // Borrar las pelotas más viejas
        this.pelotas.push(pelota);
        if (this.pelotas.length > this.data.maxPelotas) {
          const vieja = this.pelotas.shift();
          vieja.parentNode && vieja.parentNode.removeChild(vieja);
        }
      }
    });

    /*
      COMPONENTE "reporte-choque"
      Cambia de color al objeto cuando algo lo golpea.
      Sirve para explicar el evento "collide" en clase.
    */
    AFRAME.registerComponent('reporte-choque', {
      init: function () {
        this.el.addEventListener('collide', () => {
          this.el.setAttribute('color', '#FF5252');
        });
      }
    });

    /*
      COMPONENTE "jugador-fisico"
      Mueve al jugador con WASD usando FÍSICA (velocidad), no teletransportando.
      Así choca con paredes (static-body) y empuja cajas (dynamic-body).
    */
    AFRAME.registerComponent('jugador-fisico', {
      schema: {
        velocidad: { type: 'number', default: 4 }   // m/s
      },

      init: function () {
        this.teclas = {};
        window.addEventListener('keydown', (e) => this.teclas[e.code] = true);
        window.addEventListener('keyup',   (e) => this.teclas[e.code] = false);

        this.camara = this.el.querySelector('[camera]');

        // Que el cuerpo no ruede como pelota
        this.el.addEventListener('body-loaded', () => {
          this.el.body.fixedRotation = true;
          this.el.body.updateMassProperties();
        });
      },

      tick: function () {
        const body = this.el.body;
        if (!body) return;

        let x = 0, z = 0;
        if (this.teclas.KeyW) z -= 1;
        if (this.teclas.KeyS) z += 1;
        if (this.teclas.KeyA) x -= 1;
        if (this.teclas.KeyD) x += 1;

        // Girar la dirección según hacia dónde mira la cámara
        const yaw = this.camara.object3D.rotation.y;
        const v = new THREE.Vector3(x, 0, z).normalize()
          .multiplyScalar(this.data.velocidad)
          .applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);

        body.wakeUp();
        body.velocity.x = v.x;
        body.velocity.z = v.z;   // la Y la sigue controlando la gravedad
      }
    });

    /*
      COMPONENTE "cuadricula-neon" (SOLO DECORATIVO, sin física)
      Dibuja una cuadrícula sutil de líneas cian sobre el piso.
      Es un THREE.LineSegments: no tiene cuerpo físico, así que no
      bloquea al jugador ni a las pelotas.
    */
    AFRAME.registerComponent('cuadricula-neon', {
      schema: {
        tamano:  { type: 'number', default: 20 },        // lado total (m)
        paso:    { type: 'number', default: 1 },         // separación entre líneas (m)
        altura:  { type: 'number', default: 0.006 },     // un pelito sobre el piso
        color:   { type: 'color',  default: '#00B8D4' },
        opacidad:{ type: 'number', default: 0.35 }
      },

      init: function () {
        const d = this.data;
        const mitad = d.tamano / 2;
        const puntos = [];

        for (let i = -mitad; i <= mitad + 0.001; i += d.paso) {
          puntos.push(i, d.altura, -mitad,  i, d.altura, mitad);   // líneas a lo largo de Z
          puntos.push(-mitad, d.altura, i,  mitad, d.altura, i);   // líneas a lo largo de X
        }

        const geo = new THREE.BufferGeometry();
        geo.setAttribute('position', new THREE.Float32BufferAttribute(puntos, 3));
        const mat = new THREE.LineBasicMaterial({
          color: d.color, transparent: true, opacity: d.opacidad
        });
        this.el.setObject3D('mesh', new THREE.LineSegments(geo, mat));
      },

      remove: function () {
        this.el.removeObject3D('mesh');
      }
    });
  </script>
</head>

<body>
  <!--
    physics: configura el "mundo físico"
      gravity     → aceleración en Y (m/s²). Prueben -1.62 (Luna) o -24.8 (Júpiter).
      restitution → qué tanto rebotan las cosas (0 = nada, 1 = rebote perfecto).
      friction    → fricción entre superficies.
      debug: true → dibuja en alambre la forma física de cada objeto.

    fog: niebla oscura lejana para dar profundidad futurista
         (empieza a 25 m, así no afecta a los objetos cercanos).
  -->
  <a-scene physics="gravity: -9.8; restitution: 0.4; friction: 0.1; debug: false"
           fog="type: linear; color: #03050D; near: 25; far: 80">

    <!-- ===== AMBIENTE FUTURISTA ===== -->
    <!-- Cielo oscuro azul-noche -->
    <a-sky color="#03050D"></a-sky>

    <!-- Luces: ambiente frío (para distinguir bien los objetos) + direccional
         + dos luces puntuales de acento en cian y azul -->
    <a-light type="ambient" color="#8FA8FF" intensity="0.7"></a-light>
    <a-light type="directional" color="#CFE8FF" intensity="0.9" position="2 4 2"></a-light>
    <a-light type="point" color="#00E5FF" intensity="0.6" distance="25" position="-6 4 -6"></a-light>
    <a-light type="point" color="#2979FF" intensity="0.6" distance="25" position="6 4 -2"></a-light>

    <!-- PISO: estático, ahora negro. Se usa una caja delgada (más estable que un plano). -->
    <a-box static-body position="0 -0.05 0" width="20" height="0.1" depth="20" color="#000000"></a-box>

    <!-- Decoración del piso (SIN física): cuadrícula sutil -->
    <a-entity cuadricula-neon="tamano: 20; paso: 1; color: #00B8D4; opacidad: 0.35"></a-entity>

    <!-- Decoración del piso (SIN física): líneas luminosas en el borde y ejes centrales.
         Son muy delgadas (2 cm) y no tienen static-body ni dynamic-body. -->
    <a-box position="0 0.01 -9.95" width="20" height="0.02" depth="0.1" material="shader: flat; color: #00E5FF"></a-box>
    <a-box position="0 0.01  9.95" width="20" height="0.02" depth="0.1" material="shader: flat; color: #00E5FF"></a-box>
    <a-box position="-9.95 0.01 0" width="0.1" height="0.02" depth="20" material="shader: flat; color: #2979FF"></a-box>
    <a-box position=" 9.95 0.01 0" width="0.1" height="0.02" depth="20" material="shader: flat; color: #2979FF"></a-box>
    <a-box position="0 0.01 0" width="0.06" height="0.02" depth="20" material="shader: flat; color: #00E5FF; opacity: 0.5; transparent: true"></a-box>
    <a-box position="0 0.01 0" width="20" height="0.02" depth="0.06" material="shader: flat; color: #2979FF; opacity: 0.5; transparent: true"></a-box>

    <!-- Decoración lejana (SIN física, fuera del piso): torres de alambre luminosas -->
    <a-box position="-14 4 -12"  width="2" height="8"  depth="2" material="shader: flat; wireframe: true; color: #00E5FF"></a-box>
    <a-box position="14 6 -14"   width="2.5" height="12" depth="2.5" material="shader: flat; wireframe: true; color: #2979FF"></a-box>
    <a-box position="-15 3 6"    width="2" height="6"  depth="2" material="shader: flat; wireframe: true; color: #2979FF"></a-box>
    <a-box position="15 5 8"     width="2" height="10" depth="2" material="shader: flat; wireframe: true; color: #00E5FF"></a-box>
    <a-box position="0 7 -18"    width="3" height="14" depth="3" material="shader: flat; wireframe: true; color: #00B8D4"></a-box>

    <!-- RAMPA: estática e inclinada 20° -->
    <a-box static-body position="-3 0.6 -4" rotation="0 0 -20" width="4" height="0.1" depth="1.5" color="#8D6E63"></a-box>

    <!-- Pelota que rueda por la rampa (dinámica) -->
    <a-sphere dynamic-body="mass: 2" position="-4.5 2.5 -4" radius="0.3" color="#FFC65D"></a-sphere>

    <!-- TORRE de cajas dinámicas: blanco para las pelotas -->
    <a-box dynamic-body="mass: 1" reporte-choque position="2 0.25 -5" width="0.5" height="0.5" depth="0.5" color="#4CC3D9"></a-box>
    <a-box dynamic-body="mass: 1" reporte-choque position="2 0.75 -5" width="0.5" height="0.5" depth="0.5" color="#4CC3D9"></a-box>
    <a-box dynamic-body="mass: 1" reporte-choque position="2 1.25 -5" width="0.5" height="0.5" depth="0.5" color="#4CC3D9"></a-box>
    <a-box dynamic-body="mass: 1" reporte-choque position="2.5 0.25 -5" width="0.5" height="0.5" depth="0.5" color="#4CC3D9"></a-box>
    <a-box dynamic-body="mass: 1" reporte-choque position="2.5 0.75 -5" width="0.5" height="0.5" depth="0.5" color="#4CC3D9"></a-box>

    <!-- Caída libre: dos esferas de distinta masa, misma altura.
         ¿Cuál llega primero? (Galileo dice: las dos al mismo tiempo) -->
    <a-sphere dynamic-body="mass: 1"  position="0 20 -6" radius="0.25" color="#EF2D5E"></a-sphere>
    <a-sphere dynamic-body="mass: 20" position="1 20 -6" radius="0.25" color="#5E35B1"></a-sphere>

    <!-- Instrucciones (color claro para que se lean sobre el fondo oscuro) -->
    <a-text value="ESPACIO / gatillo: lanzar pelota    R: reiniciar    WASD: moverse"
            position="-3 3.2 -6" color="#8EF3FF" width="7"></a-text>

    <!-- PARED: estática, el jugador no la puede atravesar -->
    <a-box static-body position="-2 1 0" width="0.2" height="2" depth="4" color="#999"></a-box>

    <!-- JUGADOR: cuerpo físico (esfera invisible de 0.4 m en los pies).
         Masa 60 kg → empuja fácil las cajas de 1 kg. -->
    <a-entity id="rig" position="0 0.4 3"
              dynamic-body="mass: 60; shape: sphere; sphereRadius: 0.4"
              jugador-fisico="velocidad: 4">
      <!-- Cámara SIN wasd-controls (si no, atraviesa todo). En la compu lanza con ESPACIO -->
      <!-- VELOCIDAD DE LANZAMIENTO (cámara): ajusta "velocidad" aquí (m/s) -->
      <a-entity camera look-controls position="0 1.2 0"
                lanzador="velocidad: 20; masa: 1"></a-entity>

      <!-- Controles del Quest: lanzan con el gatillo -->
      <!-- VELOCIDAD DE LANZAMIENTO (control derecho e izquierdo): ajusta "velocidad" aquí (m/s) -->
      <a-entity laser-controls="hand: right" lanzador="velocidad: 20"></a-entity>
      <a-entity laser-controls="hand: left"  lanzador="velocidad: 20"></a-entity>
    </a-entity>

  </a-scene>
</body>
</html>
